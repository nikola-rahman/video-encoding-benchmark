data_dir: ./data

inputs:
  dir: ./data/samples/prepared

codecs: [av1, h265]

storage:
  s3:
    prefix: samples/prepared
    url_expiry: 604800

vmaf:
  threads: null
  model: null

providers:
  bitmovin:
    enabled: true
    s3_output_base_path: encoding-benchmarks/
    per_title:
      max_bitrate: null
      min_bitrate: null

  vidaio:
    enabled: true

  mediaconvert:
    enabled: false
    region: us-east-1
    s3_output_prefix: benchmark-outputs/

  mux:
    enabled: false

  cloudflare:
    enabled: false

  zencoder:
    enabled: false
    s3_output_prefix: benchmark-outputs/
