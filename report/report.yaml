version: "0.1"
author: "Nikola Rahman"
commissioned_by: "Vidaio"
repo_url: "https://github.com/nikola-rahman/video-compression-benchmark"

# VMAF thresholds used throughout the report
vmaf_transparent: 93
vmaf_indistinguishable: 95

# S3 storage cost assumption (USD per GB per month)
storage_cost_per_gb_month: 0.023

# Scenario for storage cost projections
projection:
  num_videos: 1000000
  duration_s: 60
  resolution: "1080p"
  source_bitrate_kbps: 5000  # representative 1080p source bitrate

# Provider display names (alphabetical order in all tables)
providers:
  - id: bitmovin
    name: "Bitmovin"
  - id: mediaconvert
    name: "AWS MediaConvert"
  - id: vidaio
    name: "Vidaio"
  - id: zencoder
    name: "Brightcove Zencoder"

codecs:
  - av1
  - h265

verticals:
  - id: ecommerce
    name: "E-Commerce"
    thumb: "thumb_ecom_watch.jpg"
  - id: ugc
    name: "UGC"
    thumb: "thumb_ugc_rare_photos.jpg"
  - id: archive
    name: "Archives"
    thumb: "thumb_archive_achievement_usa_1955.jpg"
  # - id: education
  #   name: "Education"
  - id: security
    name: "Security & Surveillance"
    thumb: "thumb_security_virat_001.jpg"

# Input data
data:
  results: "data/results.csv"
  clip_metadata: "data/clip_metadata.csv"
  encoding_times: "data/encoding_times.csv"
  pricing: "data/pricing.csv"
  perframe_vmaf: "data/perframe_vmaf.csv"
  iframe_data: "data/iframe_data.csv"

# Output
output_dir: "output"
figures_dir: "figures"
