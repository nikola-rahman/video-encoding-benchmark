# Video sample catalog for the compression benchmark.
# Each source is a video to download and use as benchmark input.
#
# Fields:
#   id        — unique identifier, used as output filename
#   vertical  — industry vertical (ecommerce, ugc, archive, education, security)
#   name      — human-readable description
#   url       — download URL
#   method    — download method: ffmpeg (m3u8/direct), yt-dlp (youtube/social), http, manual
#   license   — content license
#   trim      — optional override: {start: seconds, duration: seconds}

# Videos longer than this are trimmed from the start automatically.
# Per-source trim settings override this.
max_duration: 120

